[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-iam"
version = "0.1.0"
description = "Evidence-first fine-tuning, evaluation, and routing for IAM support-ticket triage"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ModelForge contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
modelforge-api = "modelforge.api.app:run"
modelforge-eval = "modelforge.experiments.run_evaluation:main"
modelforge-train = "modelforge.training.train_lora:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelforge = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: crosses multiple ModelForge components",
  "optional_ml: requires optional model-training dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
