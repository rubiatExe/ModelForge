services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # The image is read-only. Keep the keyless demo's telemetry in memory;
      # production deployments should mount/configure a governed sink.
      MODELFORGE_TELEMETRY_PATH: ""
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
