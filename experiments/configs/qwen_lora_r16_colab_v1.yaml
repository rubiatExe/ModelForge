config_version: "1.0"
experiment_name: qwen_lora_r16_colab_v1
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
model_revision: 7ae557604adf67be50417f59c2c2f167def9a775
tokenizer_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
tokenizer_revision: 7ae557604adf67be50417f59c2c2f167def9a775
trust_remote_code: false
# The model is downloaded into Colab's temporary VM, never the caller's Mac.
local_files_only: false
require_resolved_revision: true

train_data: data/iam_triage_v1/train.jsonl
validation_data: data/iam_triage_v1/validation.jsonl
prompt_path: prompts/iam_triage_v1.txt
# Colab deletes its VM after the session. The notebook uploads this directory
# to a pre-created private Hugging Face artifact repository after each phase.
output_root: /content/modelforge-output/runs

seed: 17
max_length: 1024
minimum_response_tokens: 16
training_confidence: 0.5

epochs: 3
optimizer: adamw_torch
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.03
train_batch_size: 4
validation_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: false
max_grad_norm: 1.0
logging_steps: 10
save_total_limit: 2
early_stopping_patience: 2
dataloader_num_workers: 0

# Fail instead of silently running on CPU when Colab did not allocate a GPU.
device: cuda
# Auto selects BF16 on supported GPUs and FP16 otherwise.
precision: auto
deterministic_algorithms: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
