<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 520">
<title id="title">Training-label quality ablation</title>
<desc id="desc">Synthetic IAM benchmark · classical issue_type macro F1 · gold validation/test unchanged</desc>
<style>
