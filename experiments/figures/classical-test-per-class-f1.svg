<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 520">
<title id="title">Locked-test per-class F1</title>
<desc id="desc">Synthetic IAM benchmark · classical issue_type classifier · 200 locked cases</desc>
<style>
